<title>Lens by Level</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one figure. A 7-row × 4-column matrix of short claims over nested timescales, with persona
   as a cross-cutting marker rather than a column; cells filled on an ordinal evidence ramp (one hue);
   a strip under the headers for where published views place the subject; legend, tag grammar and a
   source key inside the figure; reading notes and a numbered source list underneath. */
:root{
  --bg:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --ink-3:#898781;
  --hair:#e1e0d9; --rule:#c3c2b7;
  --t3:#104281; --t2:#256abf; --t1:#86b6ef;            /* ordinal ramp, strong → weak */
  --on-t3:#ffffff; --on-t2:#ffffff; --on-t1:#0b0b0b;
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#898781;
  --hair:#2c2c2a; --rule:#383835;
  --t3:#9ec5f4; --t2:#256abf; --t1:#184f95;
  --on-t3:#0b0b0b; --on-t2:#ffffff; --on-t1:#f0efec; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --ink-3:#898781;
  --hair:#2c2c2a; --rule:#383835;
  --t3:#9ec5f4; --t2:#256abf; --t1:#184f95;
  --on-t3:#0b0b0b; --on-t2:#ffffff; --on-t1:#f0efec; color-scheme:dark }

body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1200px;margin:0 auto}
.fig{background:var(--surface);border:1px solid var(--hair);border-radius:6px;padding:20px 20px 14px}
.fig h1{font-size:21px;font-weight:600;letter-spacing:-0.01em;margin:0 0 3px;text-wrap:balance}
.fig .sub{color:var(--ink-2);margin:0 0 14px;max-width:88ch;font-size:13.5px}
.scroll{overflow-x:auto}
.mx{display:grid;grid-template-columns:132px repeat(4,minmax(190px,1fr));gap:6px;min-width:900px}
.mx .corner{align-self:end;font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:0 0 7px 2px}
.mx .h{align-self:end;padding:0 4px 6px;border-bottom:1px solid var(--rule);font-weight:600;font-size:14px;line-height:1.25}
.mx .h span{display:block;font-weight:400;font-size:12px;color:var(--ink-2)}
.mx .cs{font-size:11.5px;line-height:1.35;color:var(--ink-2);padding:2px 4px 0}
.mx .cs b{font-weight:600;color:var(--ink);display:block;font-size:11px;letter-spacing:.04em;text-transform:uppercase;margin-bottom:1px}
.mx .csl{font-size:11.5px;line-height:1.35;color:var(--ink-2);padding:2px 6px 0 2px;font-style:italic}
.mx .g{grid-column:1 / -1;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2);padding:14px 2px 1px;font-weight:600}
.mx .g em{font-style:normal;text-transform:none;letter-spacing:0;font-weight:400;margin-left:10px;color:var(--ink-3)}
.mx .r{font-weight:600;font-size:14px;line-height:1.25;padding:9px 6px 0 2px}
.mx .r span{display:block;font-weight:400;font-size:12px;color:var(--ink-2);margin-top:2px}
.c{border-radius:5px;padding:9px 10px 8px;min-height:92px;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--hair);color:var(--ink)}
.c b{font-weight:600;font-size:13px;line-height:1.3;margin-bottom:3px;text-wrap:balance}
.c b em{font-style:normal;font-size:11px;vertical-align:1px;margin-right:4px}
.c i{font-style:normal;font-size:12px;line-height:1.38;color:var(--ink-2)}
.c u{text-decoration:none;font-family:var(--mono);font-size:11px;margin-top:auto;padding-top:7px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;color:var(--ink-2)}
.c u s{text-decoration:none;letter-spacing:.08em;white-space:nowrap}
.c.t3{background:var(--t3);border-color:var(--t3);color:var(--on-t3)} .c.t3 i,.c.t3 u{color:var(--on-t3)}
.c.t2{background:var(--t2);border-color:var(--t2);color:var(--on-t2)} .c.t2 i,.c.t2 u{color:var(--on-t2)}
.c.t1{background:var(--t1);border-color:var(--t1);color:var(--on-t1)} .c.t1 i,.c.t1 u{color:var(--on-t1)}
.lg{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:12px;color:var(--ink-2);padding:14px 2px 0}
.lg .sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:6px;vertical-align:-2px;border:1px solid var(--ink-3)}
.lg .k{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:5px;letter-spacing:.08em}
.rule{font-size:12px;color:var(--ink-2);padding:6px 2px 0}
.keys{font-family:var(--mono);font-size:11px;color:var(--ink-2);padding:10px 2px 0;line-height:1.6;border-top:1px solid var(--hair);margin-top:10px}
.keys b{font-weight:500;color:var(--ink)}
.foot{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:8px 2px 0;display:flex;flex-wrap:wrap;gap:4px 18px}
.notes{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px 32px;margin:22px 0 0;font-size:13px;color:var(--ink-2)}
.notes h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 6px;font-weight:600}
.notes p{margin:0 0 8px}
.notes ul,.notes ol{margin:0;padding-left:18px}
.notes li{margin:0 0 5px}
.notes b{color:var(--ink);font-weight:600}
.src{margin:22px 0 0;font-size:12.5px;color:var(--ink-2)}
.src h2{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px;font-weight:600}
.src ol{columns:2;column-gap:32px;padding-left:20px;margin:0}
.src li{break-inside:avoid;margin:0 0 7px}
.src li b{color:var(--ink);font-weight:500;font-family:var(--mono);font-size:11.5px}
.src a{color:inherit}
@media (max-width:760px){.src ol{columns:1}}
</style>
